<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AukFlow · 训练</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --ok:#3fb950; --bad:#f85149; --blue:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif; padding:18px; }
  h2 { font-size:16px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .drop { border:2px dashed var(--border); border-radius:8px; padding:22px; text-align:center; color:var(--dim); margin-bottom:14px; cursor:pointer; }
  .drop.loaded { border-color:var(--ok); color:var(--ok); }
  .row { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:14px; }
  .stat b { display:block; font-size:17px; }
  .stat span { font-size:11px; color:var(--dim); }
  .hist { display:flex; align-items:center; gap:8px; font-size:12px; margin:2px 0; }
  .hist .lbl { width:72px; color:var(--dim); }
  .hist .bar { background:var(--blue); height:10px; border-radius:3px; min-width:2px; }
  .audit-ok { color:var(--ok); } .audit-bad { color:var(--bad); }
  pre { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px; font-size:12px; overflow-x:auto; }
  button { background:#1f6feb; color:#fff; border:none; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px; }
  button.ghost { background:var(--panel); border:1px solid var(--border); color:var(--text); }
  #genOut { color:var(--dim); font-size:12px; margin-left:8px; }
</style>
</head>
<body>
<h2>训练 · 语料管理</h2>
<div class="sub">审计规则与 core corpus.ts 同源（字段白名单 / 年龄区间）· 训练引擎在 services/training（Python）</div>

<div class="drop" id="drop">拖入 auk-trials.jsonl / synthetic_corpus.jsonl，或点击选择文件
  <input type="file" id="file" accept=".jsonl,.txt" style="display:none">
</div>

<div class="row" id="stats" style="display:none">
  <div class="stat"><b id="sN">0</b><span>trials</span></div>
  <div class="stat"><b id="sDist">—</b><span>距离 P25/P50/P75 (px)</span></div>
  <div class="stat"><b id="sDur">—</b><span>时长 P25/P50/P75 (ms)</span></div>
</div>
<div id="histBox" style="display:none"></div>
<div id="audit"></div>

<h2 style="margin-top:20px">演示轨迹</h2>
<div class="sub">WindMouse 内核（V1 规则）生成 → 发送到「模拟」页作为模型轨迹回放</div>
<div>
  <button id="gen">生成并发送到模拟页</button><span id="genOut"></span>
</div>

<script>
"use strict";
const ALLOWED = new Set(["points","dist","angle","duration","age_band","device"]);
const AGE_RE = /^(14-17|18-25|26-35|36-45|46-55|56-65|66\+)$/;

function analyze(text) {
  const issues = [], trials = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    try {
      const t = JSON.parse(line);
      Object.keys(t).forEach(k => { if (!ALLOWED.has(k)) issues.push(`第 ${i+1} 行：非白名单字段 "${k}"（指纹风险）`); });
      if (t.age_band !== undefined && !AGE_RE.test(String(t.age_band))) issues.push(`第 ${i+1} 行：age_band 须为粗区间`);
      if (!Array.isArray(t.points) || t.points.length < 3) issues.push(`第 ${i+1} 行：points 缺失或 <3`);
      trials.push(t);
    } catch { issues.push(`第 ${i+1} 行：JSON 解析失败`); }
  });
  return { trials, issues };
}
function render(res) {
  const { trials, issues } = res;
  document.getElementById("stats").style.display = "flex";
  document.getElementById("histBox").style.display = "block";
  const q = (arr, p) => { const s=[...arr].sort((a,b)=>a-b); return s.length ? Math.round(s[Math.min(s.length-1, Math.floor(p*s.length))]) : 0; };
  const dists = trials.map(t=>t.dist).filter(d=>d>0), durs = trials.map(t=>t.duration).filter(d=>d>0);
  document.getElementById("sN").textContent = trials.length;
  document.getElementById("sDist").textContent = [q(dists,.25),q(dists,.5),q(dists,.75)].join(" / ");
  document.getElementById("sDur").textContent = [q(durs,.25),q(durs,.5),q(durs,.75)].join(" / ");
  const buckets=[0,100,200,400,700,1000,1500,Infinity], hb=document.getElementById("histBox");
  hb.innerHTML = "<div style='font-size:12px;color:var(--dim);margin-bottom:4px'>距离分布</div>";
  const counts = buckets.slice(0,-1).map((lo,i)=>dists.filter(d=>d>=lo&&d<buckets[i+1]).length);
  const maxN = Math.max(...counts,1);
  buckets.slice(0,-1).forEach((lo,i)=>{
    const row=document.createElement("div"); row.className="hist";
    row.innerHTML=`<span class="lbl">${lo}-${buckets[i+1]===Infinity?"∞":buckets[i+1]}px</span><div class="bar" style="width:${counts[i]/maxN*300}px"></div><span>${counts[i]}</span>`;
    hb.appendChild(row);
  });
  const a=document.getElementById("audit");
  a.innerHTML = `<h3 style="font-size:13px" class="${issues.length?"audit-bad":"audit-ok"}">审计 ${issues.length?"✗ "+issues.length+" 项问题":"✓ 通过"}</h3>` +
    issues.slice(0,8).map(s=>`<div class="audit-bad" style="font-size:12px">${s}</div>`).join("");
}

const drop=document.getElementById("drop"), file=document.getElementById("file");
drop.onclick=()=>file.click();
drop.ondragover=e=>e.preventDefault();
drop.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)read(f);};
file.onchange=()=>file.files[0]&&read(file.files[0]);
function read(f){const rd=new FileReader();rd.onload=()=>{render(analyze(String(rd.result)));drop.classList.add("loaded");drop.textContent="已加载 "+f.name+"（点击更换）";file.style.display="none";};rd.readAsText(f);}

// —— WindMouse（core V1 内核 JS 版）生成演示轨迹，发给宿主 → 模拟页 ——
function windmouse(from,to){
  const g=9,w=3,ms=10;let vx=0,vy=0,t=0,x=from.x,y=from.y;
  const steps=[{dt:0,x,y}];
  for(let i=0;i<2000;i++){
    const rx=to.x-x,ry=to.y-y,rem=Math.hypot(rx,ry);
    if(rem<0.6)break;
    const ws=Math.min(1,rem/160);
    vx+=(Math.random()*2-1)*w*ws; vy+=(Math.random()*2-1)*w*ws;
    vx=vx*0.72+(rx/rem)*g*ws;     vy=vy*0.72+(ry/rem)*g*ws;
    let dx=vx,dy=vy;const len=Math.hypot(dx,dy);
    if(len>ms){dx=dx/len*ms;dy=dy/len*ms;}
    if(rem<12){dx=rx*0.35;dy=ry*0.35;}
    const dt=Math.max(3,8*(0.8+Math.random()*0.4));
    x+=dx;y+=dy;t+=dt;steps.push({dt,x,y});
  }
  steps.push({dt:80+Math.random()*220,x,y});
  return steps;
}
document.getElementById("gen").onclick=()=>{
  const steps=windmouse({x:100,y:500},{x:100+Math.round(200+Math.random()*600),y:100+Math.round(Math.random()*400)});
  parent.postMessage({type:"auk:sim-load",steps},"*");
  const last=steps[steps.length-1],first=steps[0];
  document.getElementById("genOut").textContent=`已发送 ${steps.length} 步 · ${Math.round(Math.hypot(last.x-first.x,last.y-first.y))}px`;
};
</script>
</body>
</html>
