<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AukFlow 靶场 · 轨迹采集</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#ddd;font:14px/1.5 system-ui}
  #hud{position:fixed;top:0;left:0;right:0;padding:8px 14px;display:flex;gap:16px;
       background:rgba(0,0,0,.6);z-index:9;align-items:center;flex-wrap:wrap}
  #hud b{color:#7fd1ff}
  #stage{position:relative;height:100vh;cursor:crosshair;user-select:none;touch-action:none;overflow:hidden}
  #ink{position:absolute;inset:0;pointer-events:none}
  .dot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
  .dot.b{background:#e05555;box-shadow:0 0 12px #e05555}
  .dot.a{background:#3fb950;box-shadow:0 0 10px #3fb950;opacity:.9}
  button{background:#245;color:#cfe;padding:.3em .9em;border:1px solid #468;border-radius:4px;cursor:pointer}
  #confirm{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:none;gap:10px;
           background:rgba(0,0,0,.75);border:1px solid #444;border-radius:10px;padding:12px 18px;
           align-items:center;z-index:10}
  #confirm .info{font-size:12px;color:#9ab;margin-right:6px}
  #okBtn{background:#273;background-border:none;font-weight:600}
  #retryBtn{background:#532}
  #age{background:#1a1a1a;color:#ddd;border:1px solid #444;border-radius:4px;padding:.25em}
  #under14{color:#f66;display:none}
  #tip{position:fixed;bottom:6px;right:12px;font-size:11px;color:#666;z-index:8}
</style>
</head>
<body>
<div id="hud">
  <span>trials: <b id="count">0</b></span>
  <span>导出: <button id="dl">下载 JSONL</button></span>
  <span style="display:none" id="saveWrap">保存: <button id="saveBtn">存入语料库（桌面端）</button></span>
  <span>
    <label>年龄段:
      <select id="age">
        <option value="">不提供</option>
        <option>14-17</option><option>18-25</option><option>26-35</option>
        <option>36-45</option><option>46-55</option><option>56-65</option><option>66+</option>
      </select>
    </label>
  </span>
  <span>设备: <select id="dev"><option>mouse</option><option>trackpad</option></select></span>
  <span>
    <label>点位模式:
      <select id="mode">
        <option value="random">随机点位（距离谱×八方向）</option>
        <option value="fixed">固定点位（3×3 网格循环）</option>
      </select>
    </label>
  </span>
  <span id="under14">未满 14 周岁：采集不可用</span>
</div>
<div id="stage">
  <canvas id="ink"></canvas>
</div>
<div id="confirm">
  <span class="info" id="cInfo"></span>
  <button id="okBtn">✓ OK 保留</button>
  <button id="retryBtn">↺ 重试丢弃</button>
</div>
<div id="tip">A=绿（起点） B=红（目标）· 点击 B 后回放确认</div>
<script>
"use strict";
// —— 合规闸门（spec data-collection）：14 岁以下不采集 ——
const gate = { under14: false, blocked: false };
// 靶场不询问精确年龄；年龄段为可选区间标签（匿名格式的一部分）
// under14 状态由宿主环境注入（window.__AUK_AGE_GATE__），页面本身不收集生日
if (window.__AUK_AGE_GATE__ === "under14") { gate.under14 = true; gate.blocked = true;
  document.getElementById("under14").style.display = "inline"; }

// —— 距离谱/八方向/随机延迟（spec: trial 结构化输出的采集设计）——
const DISTANCES = [60, 120, 220, 380, 620, 900, 1200, 1500]; // px 谱
const ANGLES = [0, 45, 90, 135, 180, 225, 270, 315];          // 八方向
// —— 固定点位模式：3×3 网格（覆盖近/中/远距离与全部八方向）——
function fixedGrid() {
  const cols = [0.18, 0.5, 0.82], rows = [0.22, 0.5, 0.78];
  const pts = [];
  for (const ry of rows) for (const cx of cols) pts.push({ x: innerWidth * cx, y: innerHeight * ry });
  return pts; // 顺序循环 → 中心↔角落距离谱 60~1500px 全覆盖
}
let gridOrder = fixedGrid(), gridIdx = 0;
addEventListener("resize", () => { gridOrder = fixedGrid(); gridIdx = 0; fitInk(); });

const state = {
  trials: [],        // 已确认保留的 trial
  pending: null,     // 待确认（OK 后入列）
  target: null,      // 当前红点 B（DOM）
  startDot: null,    // 起点绿点 A（DOM，首个 pointermove 时放置）
  phase: "waiting",  // waiting（等 B 出现）| recording | review（回放确认）
  moveStart: null, recording: [],
};
const stage = document.getElementById("stage");
const ink = document.getElementById("ink"), ictx = ink.getContext("2d");
const confirmBar = document.getElementById("confirm");
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function fitInk() {
  ink.width = innerWidth * devicePixelRatio;
  ink.height = innerHeight * devicePixelRatio;
  ictx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
fitInk();

function clearDots() {
  state.target?.remove(); state.target = null;
  state.startDot?.remove(); state.startDot = null;
}
function mkDot(cls, x, y) {
  const d = document.createElement("div");
  d.className = "dot " + cls;
  d.style.left = x + "px"; d.style.top = y + "px";
  d.style.width = d.style.height = cls === "b" ? 26 : 18;
  stage.appendChild(d);
  return d;
}
function drawPath(pts, animate = false) {
  ictx.clearRect(0, 0, innerWidth, innerHeight);
  if (!animate) { strokeAll(pts); return; }
  // 按真实时间回放
  const total = pts[pts.length - 1][0] || 1;
  const t0 = performance.now();
  const tick = () => {
    const el = performance.now() - t0;
    const upto = pts.filter(p => p[0] <= el);
    ictx.clearRect(0, 0, innerWidth, innerHeight);
    strokeAll(upto.length ? upto : [pts[0]]);
    if (el < total) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function strokeAll(pts) {
  ictx.strokeStyle = "rgba(127,209,255,.9)";
  ictx.lineWidth = 2; ictx.lineJoin = "round";
  ictx.beginPath();
  pts.forEach((p, i) => i ? ictx.lineTo(p[1], p[2]) : ictx.moveTo(p[1], p[2]));
  ictx.stroke();
  // 起点标记
  if (pts.length) { ictx.fillStyle = "#3fb950"; ictx.beginPath(); ictx.arc(pts[0][1], pts[0][2], 4, 0, 7); ictx.fill(); }
}

function nextTrial() {
  if (gate.blocked) return;
  confirmBar.style.display = "none";
  ictx.clearRect(0, 0, innerWidth, innerHeight);
  clearDots();
  state.phase = "waiting"; state.recording = []; state.moveStart = null; state.pending = null;

  const prev = { x: innerWidth * rand(.3, .7), y: innerHeight * rand(.3, .7) }; // A=光标当前位置
  const fixed = document.getElementById("mode").value === "fixed";
  let x, y;
  if (fixed) {
    const p = gridOrder[gridIdx % gridOrder.length]; gridIdx++;
    x = p.x; y = p.y;
  } else {
    const dist = pick(DISTANCES), theta = (pick(ANGLES) + rand(-15, 15)) * Math.PI / 180;
    x = prev.x + Math.cos(theta) * dist; y = prev.y + Math.sin(theta) * dist;
    x = Math.min(Math.max(x, 30), innerWidth - 30);
    y = Math.min(Math.max(y, 60), innerHeight - 30);
  }
  setTimeout(() => {
    if (state.phase !== "waiting") return;
    state.target = mkDot("b", x, y);
    state.phase = "recording";
  }, rand(500, 2000));
}

stage.addEventListener("pointermove", (e) => {
  if (state.phase !== "recording" || gate.blocked) return;
  if (state.recording.length === 0) {
    state.recording.push([0, e.clientX, e.clientY]);
    state.moveStart = performance.now();
    state.startDot = mkDot("a", e.clientX, e.clientY); // A 点可见
    return;
  }
  state.recording.push([Math.round(performance.now() - state.moveStart), e.clientX, e.clientY]);
});

stage.addEventListener("pointerdown", (e) => {
  if (gate.blocked) return;
  if (state.phase === "recording" && state.target) {
    const pts = state.recording;
    if (pts.length) pts.push([Math.round(performance.now() - state.moveStart), e.clientX, e.clientY]);
    if (pts.length < 3) { nextTrial(); return; } // 无移动记录 → 脏数据，直接跳下一个
    // —— 回放确认态 ——
    state.phase = "review";
    // B 点标记到点击处（视觉对齐落点）
    state.target.style.left = e.clientX + "px";
    state.target.style.top = e.clientY + "px";
    // A 点对齐轨迹真实起点
    if (state.startDot) {
      state.startDot.style.left = pts[0][1] + "px";
      state.startDot.style.top = pts[0][2] + "px";
    } else {
      state.startDot = mkDot("a", pts[0][1], pts[0][2]);
    }
    // 标签用轨迹真实起终点（光标实际位置 → 点击点）
    const p0 = pts[0], p1 = pts[pts.length - 1];
    const dist = Math.round(Math.hypot(p1[1] - p0[1], p1[2] - p0[2]));
    let angle = Math.round(Math.atan2(p1[2] - p0[2], p1[1] - p0[1]) * 180 / Math.PI);
    if (angle < 0) angle += 360;
    state.pending = {
      points: pts, dist, angle,
      duration: pts[pts.length - 1][0],
      age_band: document.getElementById("age").value || undefined,
      device: document.getElementById("dev").value,
    };
    drawPath(pts, true); // 按真实时间回放刚录的轨迹
    document.getElementById("cInfo").textContent =
      `${dist}px · ${angle}° · ${state.pending.duration}ms · ${pts.length} 点`;
    confirmBar.style.display = "flex";
  } else if (state.phase === "review") {
    // 回放态点击空白 = 重试（快速操作流）
    retry();
  }
});

function ok() {
  if (!state.pending) return;
  state.trials.push(state.pending);
  document.getElementById("count").textContent = state.trials.length;
  state.pending = null;
  nextTrial();
}
function retry() {
  state.pending = null;
  nextTrial();
}
document.getElementById("okBtn").onclick = (e) => { e.stopPropagation(); ok(); };
document.getElementById("retryBtn").onclick = (e) => { e.stopPropagation(); retry(); };
// 键盘快捷键：Enter/Space=OK，Esc/R=重试
addEventListener("keydown", (e) => {
  if (state.phase !== "review") return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ok(); }
  if (e.key === "Escape" || e.key.toLowerCase() === "r") retry();
});

document.getElementById("dl").onclick = () => {
  // 匿名格式导出（spec：无 ID/无指纹/年龄区间化；单条 trial 独立成行 JSONL）
  const lines = state.trials.map((t) => JSON.stringify(t)).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines], { type: "application/x-ndjson" }));
  a.download = "auk-trials.jsonl"; a.click();
};
// 宿主桥（desktop 插件内嵌时）：保存到语料库
addEventListener("message", (e) => {
  if (e.data?.type === "auk:request-corpus") {
    const lines = state.trials.map((t) => JSON.stringify(t)).join("\n");
    e.source?.postMessage({ type: "auk:corpus", jsonl: lines }, "*");
  }
  if (e.data?.type === "auk:saved") {
    document.getElementById("saveBtn").textContent = "已保存 ✓";
    setTimeout(() => (document.getElementById("saveBtn").textContent = "存入语料库（桌面端）"), 2000);
  }
});
if (window.parent !== window) {
  document.getElementById("saveWrap").style.display = "inline";
  document.getElementById("saveBtn").onclick = () => {
    const jsonl = state.trials.map((t) => JSON.stringify(t)).join("\n");
    if (!jsonl) { alert("还没有已确认的 trial"); return; }
    const ts = new Date().toISOString().slice(0, 10).replace(/-/g, "");
    parent.postMessage({ type: "auk:save-corpus", name: `range-${ts}.jsonl`, content: jsonl }, "*");
  };
}
if (!gate.blocked) nextTrial();
</script>
</body>
</html>
