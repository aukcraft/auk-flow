<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AukFlow 靶场 · 轨迹采集</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#ddd;font:14px/1.5 system-ui}
  #hud{position:fixed;top:0;left:0;right:0;padding:8px 14px;display:flex;gap:16px;
       background:rgba(0,0,0,.6);z-index:9;align-items:center;flex-wrap:wrap}
  #hud b{color:#7fd1ff}
  #stage{position:relative;height:100vh;cursor:crosshair;user-select:none;touch-action:none}
  .dot{position:absolute;border-radius:50%;background:#e05555;box-shadow:0 0 12px #e05555;
       transform:translate(-50%,-50%);pointer-events:none}
  button{background:#245;color:#cfe;padding:.3em .9em;border:1px solid #468;border-radius:4px;cursor:pointer}
  #age{background:#1a1a1a;color:#ddd;border:1px solid #444;border-radius:4px;padding:.25em}
  #under14{color:#f66;display:none}
</style>
</head>
<body>
<div id="hud">
  <span>trials: <b id="count">0</b></span>
  <span>导出: <button id="dl">下载 JSONL</button></span>
  <span>
    <label>年龄段:
      <select id="age">
        <option value="">不提供</option>
        <option>14-17</option><option>18-25</option><option>26-35</option>
        <option>36-45</option><option>46-55</option><option>56-65</option><option>66+</option>
      </select>
    </label>
  </span>
  <span>设备: <select id="dev"><option>mouse</option><option>trackpad</option></select></span>
  <span>
    <label>点位模式:
      <select id="mode">
        <option value="random">随机点位（距离谱×八方向）</option>
        <option value="fixed">固定点位（3×3 网格循环）</option>
      </select>
    </label>
  </span>
  <span id="under14">未满 14 周岁：采集不可用</span>
</div>
<div id="stage"></div>
<script>
"use strict";
// —— 合规闸门（spec data-collection）：14 岁以下不采集 ——
const gate = { under14: false, blocked: false };
// 靶场不询问精确年龄；年龄段为可选区间标签（匿名格式的一部分）
// under14 状态由宿主环境注入（window.__AUK_AGE_GATE__），页面本身不收集生日
if (window.__AUK_AGE_GATE__ === "under14") { gate.under14 = true; gate.blocked = true;
  document.getElementById("under14").style.display = "inline"; }

// —— 距离谱/八方向/随机延迟（spec: trial 结构化输出的采集设计）——
const DISTANCES = [60, 120, 220, 380, 620, 900, 1200, 1500]; // px 谱
const ANGLES = [0, 45, 90, 135, 180, 225, 270, 315];          // 八方向
// —— 固定点位模式：3×3 网格（覆盖近/中/远距离与全部八方向）——
function fixedGrid() {
  const cols = [0.18, 0.5, 0.82], rows = [0.22, 0.5, 0.78];
  const pts = [];
  for (const ry of rows) for (const cx of cols) pts.push({ x: innerWidth * cx, y: innerHeight * ry });
  return pts; // 顺序循环 → 中心↔角落距离谱 60~1500px 全覆盖
}
let gridOrder = fixedGrid(), gridIdx = 0;
addEventListener("resize", () => { gridOrder = fixedGrid(); gridIdx = 0; });
const state = {
  trials: [],          // {points:[[t,x,y],...], dist, angle, duration, age_band?, device}
  prev: null,          // 上一落点（目标 A）
  target: null,        // 当前红点（目标 B）
  moveStart: null, recording: [],
};
const stage = document.getElementById("stage");
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function nextTrial() {
  if (gate.blocked) return;
  const prev = state.target
    ? { x: parseFloat(state.target.style.left), y: parseFloat(state.target.style.top) }
    : { x: innerWidth * rand(.3, .7), y: innerHeight * rand(.3, .7) };
  const fixed = document.getElementById("mode").value === "fixed";
  let x, y;
  if (fixed) {
    const p = gridOrder[gridIdx % gridOrder.length]; gridIdx++;
    x = p.x; y = p.y;
  } else {
    const dist = pick(DISTANCES), theta = (pick(ANGLES) + rand(-15, 15)) * Math.PI / 180;
    x = prev.x + Math.cos(theta) * dist; y = prev.y + Math.sin(theta) * dist;
    // 保持在视口内（不改变方向，夹紧距离）
    x = Math.min(Math.max(x, 30), innerWidth - 30);
    y = Math.min(Math.max(y, 60), innerHeight - 30);
  }
  // 随机出现延迟 0.5~2s（防预判）
  setTimeout(() => spawnDot({ x, y }, prev, Math.hypot(x - prev.x, y - prev.y), Math.atan2(y - prev.y, x - prev.x)),
             rand(500, 2000));
}
function spawnDot(pos, from, dist, theta) {
  if (state.target) state.target.remove();
  const d = document.createElement("div");
  d.className = "dot";
  d.style.left = pos.x + "px"; d.style.top = pos.y + "px";
  d.style.width = d.style.height = "26px";
  stage.appendChild(d);
  state.target = d;
  state.moveStart = null;      // 记录从「点出现」开始的指针轨迹
  state.recording = [];
  state.trialMeta = { from, dist, angle: theta * 180 / Math.PI };
}
stage.addEventListener("pointermove", (e) => {
  if (!state.target || gate.blocked) return;
  if (state.recording.length === 0) {
    state.recording.push([0, e.clientX, e.clientY]);
    state.moveStart = performance.now();
    return;
  }
  state.recording.push([Math.round(performance.now() - state.moveStart), e.clientX, e.clientY]);
});
stage.addEventListener("pointerdown", (e) => {
  if (!state.target || gate.blocked) return;
  const t = state.trialMeta, pts = state.recording;
  const last = pts[pts.length - 1];
  if (last) pts.push([Math.round(performance.now() - state.moveStart), e.clientX, e.clientY]);
  // 剔除过短 trial（脏数据：无移动记录）
  if (pts.length >= 3) {
    const trial = {
      points: pts,
      dist: Math.round(t.dist), angle: Math.round(t.angle),
      duration: pts[pts.length - 1][0],
      age_band: document.getElementById("age").value || undefined,
      device: document.getElementById("dev").value,
    };
    state.trials.push(trial);
    document.getElementById("count").textContent = state.trials.length;
  }
  nextTrial();
});
document.getElementById("dl").onclick = () => {
  // 匿名格式导出（spec：无 ID/无指纹/年龄区间化；单条 trial 独立成行 JSONL）
  const lines = state.trials.map((t) => JSON.stringify(t)).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines], { type: "application/x-ndjson" }));
  a.download = "auk-trials.jsonl"; a.click();
};
if (!gate.blocked) nextTrial();
</script>
</body>
</html>
