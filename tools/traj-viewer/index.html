<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AukFlow · 虚拟轨迹查看器</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e;
    --gen: #58a6ff; --ref: #3fb950; --accent: #d29922;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; height: 100vh; overflow: hidden;
  }
  aside {
    width: 320px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 16px; gap: 12px;
  }
  h1 { font-size: 16px; }
  h1 small { color: var(--dim); font-weight: normal; font-size: 12px; display: block; }
  #file { display: none; }
  .btn {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 13px; text-align: center;
  }
  .btn:hover { border-color: var(--gen); }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; }
  .row { display: flex; gap: 8px; }
  label.ctl { color: var(--dim); font-size: 12px; display: block; margin-bottom: 4px; }
  input[type=range] { width: 100%; accent-color: var(--gen); }
  #list { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
  .item {
    padding: 6px 10px; cursor: pointer; display: flex; justify-content: space-between;
    border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .item:hover { background: #1c2129; }
  .item.sel { background: #12233f; border-left: 3px solid var(--gen); }
  .item.ref { color: var(--ref); }
  .legend { font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 10px; }
  main { flex: 1; display: flex; flex-direction: column; }
  #stage { flex: 1; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--dim); flex-direction: column; gap: 12px; pointer-events: none;
  }
  #hint kbd {
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 6px; font-size: 12px;
  }
  footer {
    border-top: 1px solid var(--border); padding: 8px 16px; font-size: 12px;
    color: var(--dim); display: flex; gap: 24px;
  }
  footer b { color: var(--text); }
</style>
</head>
<body>
<aside>
  <h1>轨迹查看器<small>AukFlow humanize · 虚拟轨迹 vs 参考轨迹</small></h1>
  <label class="btn primary" for="file">打开 JSON（demo_trajectories.json）</label>
  <input type="file" id="file" accept=".json">
  <div class="row">
    <button class="btn" id="replay">重放 ⏵</button>
    <button class="btn" id="allBtn">叠加全部</button>
  </div>
  <div>
    <label class="ctl">回放速度 <span id="spdV">1×</span></label>
    <input type="range" id="spd" min="0.1" max="4" step="0.1" value="1">
  </div>
  <div>
    <label class="ctl">轨迹粗细 <span id="wV">2</span></label>
    <input type="range" id="w" min="1" max="6" step="0.5" value="2">
  </div>
  <div class="legend">
    <i style="background:var(--gen)"></i>生成
    <i style="background:var(--ref)"></i>参考（真实/合成）
  </div>
  <div id="list"></div>
</aside>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">
      <div>拖入 <kbd>demo_trajectories.json</kbd> 或点击左侧按钮</div>
      <div style="font-size:12px">生成：cd services/training && .venv/bin/python -m auk_train.demo --synthetic 400 --epochs 120</div>
    </div>
  </div>
  <footer>
    <span>轨迹 <b id="fCount">0</b></span>
    <span>选中 <b id="fSel">—</b></span>
    <span>时长 <b id="fDur">—</b></span>
    <span>步数 <b id="fSteps">—</b></span>
    <span>末端误差 <b id="fErr">—</b></span>
  </footer>
</main>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let trajs = [], sel = -1, showAll = false, animT0 = 0, animId = 0, speed = 1, lw = 2;

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  draw();
}
addEventListener('resize', resize);

function fit(trajs) {
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const t of trajs) for (const [,x,y] of t.points) { x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); }
  const r = cv.getBoundingClientRect();
  const pad = 60, w = r.width-pad*2, h = r.height-pad*2;
  const s = Math.min(w/Math.max(x1-x0,1), h/Math.max(y1-y0,1));
  return (x,y) => [pad+(x-x0)*s + (w-(x1-x0)*s)/2, pad+(y-y0)*s + (h-(y1-y0)*s)/2];
}

function draw(upToMs = Infinity) {
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  // 网格
  ctx.strokeStyle = '#161b22'; ctx.lineWidth = 1;
  for (let x=0;x<r.width;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,r.height);ctx.stroke();}
  for (let y=0;y<r.height;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(r.width,y);ctx.stroke();}
  if (!trajs.length) return;
  const P = fit(showAll ? trajs : trajs.slice(sel, sel+1));
  const drawOne = (t, alpha) => {
    const c = t.source==='ref' ? getComputedStyle(document.documentElement).getPropertyValue('--ref') : getComputedStyle(document.documentElement).getPropertyValue('--gen');
    ctx.globalAlpha = alpha; ctx.strokeStyle = c; ctx.lineWidth = lw;
    ctx.beginPath();
    let started = false, last = null;
    for (const [tms,x,y] of t.points) {
      if (tms > upToMs) break;
      const [px,py] = P(x,y);
      started ? ctx.lineTo(px,py) : ctx.moveTo(px,py); started = true; last=[px,py];
    }
    ctx.stroke();
    if (last && upToMs < Infinity) { // 光标点
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(last[0],last[1],lw+2,0,7); ctx.fill();
    }
    // 起终点标记
    if (upToMs === Infinity) {
      const [sx,sy]=P(...t.points[0].slice(1)), [ex,ey]=P(...t.points[t.points.length-1].slice(1));
      ctx.fillStyle='#8b949e'; ctx.beginPath(); ctx.arc(sx,sy,3,0,7); ctx.fill();
      ctx.strokeStyle='#d29922'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(ex,ey,7,0,7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  };
  if (showAll) trajs.forEach(t=>drawOne(t,0.35));
  if (sel>=0) drawOne(trajs[sel],1);
}

function replay() {
  if (sel<0 && !showAll) return;
  const list = showAll ? trajs : [trajs[sel]];
  const dur = Math.max(...list.map(t=>t.points[t.points.length-1][0]));
  animT0 = performance.now(); cancelAnimationFrame(animId);
  const step = now => {
    const el = (now-animT0)*speed;
    draw(Math.min(el,dur));
    $('fDur').textContent = Math.round(Math.min(el,dur))+' / '+Math.round(dur)+' ms';
    if (el<dur) animId=requestAnimationFrame(step); else setTimeout(()=>draw(),600);
  };
  animId=requestAnimationFrame(step);
}

function loadJson(obj) {
  trajs = obj.filter(t=>t&&Array.isArray(t.points)&&t.points.length>3);
  sel = trajs.length?0:-1; showAll=false;
  $('hint').style.display='none'; $('fCount').textContent=trajs.length;
  const list=$('list'); list.innerHTML='';
  trajs.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='item'+(t.source==='ref'?' ref':'')+(i===sel?' sel':'');
    const end=t.points[t.points.length-1];
    d.innerHTML=`<span>#${i}${t.source==='ref'?' 参考':''}</span><span>${Math.round(end[0])}ms · ${t.points.length}步</span>`;
    d.onclick=()=>{sel=i;showAll=false;refresh();};
    list.appendChild(d);
  });
  refresh();
}
function refresh(){
  document.querySelectorAll('.item').forEach((d,i)=>d.classList.toggle('sel', showAll?false:i===sel));
  if (sel>=0) {
    const t=trajs[sel], p0=t.points[0], p1=t.points[t.points.length-1];
    $('fSel').textContent='#'+sel+(t.source==='ref'?'（参考）':'（生成）');
    $('fDur').textContent=Math.round(p1[0])+' ms';
    $('fSteps').textContent=t.points.length+' 步';
    $('fErr').textContent=Math.round(Math.hypot(p1[1]-p0[1],p1[2]-p0[2])===0?0:0)+' px（起点→终点位移 '+Math.round(Math.hypot(p1[1]-p0[1],p1[2]-p0[2]))+'px）';
  }
  draw();
}

$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>loadJson(JSON.parse(rd.result));rd.readAsText(f);};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>loadJson(JSON.parse(rd.result));rd.readAsText(f);});
$('replay').onclick=replay;
$('allBtn').onclick=()=>{showAll=!showAll;refresh();};
$('spd').oninput=e=>{speed=+e.target.value;$('spdV').textContent=speed+'×';};
$('w').oninput=e=>{lw=+e.target.value;$('wV').textContent=lw;draw();};
resize();
</script>
</body>
</html>
