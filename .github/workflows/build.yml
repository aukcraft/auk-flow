name: Build & Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-binaries:
    name: engine · release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: auk-motion-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: auk-motion-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: auk-motion-macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/engine

      - name: Release build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/${{ matrix.artifact }}.tar.gz" libauk_motion.*
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/*.rlib","target/${{ matrix.target }}/release/*.dll" -DestinationPath "$env:GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" -ErrorAction SilentlyContinue
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/${{ matrix.artifact }}.zip")) {
            New-Item -ItemType File -Path "$env:GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" | Out-Null
            Add-Content "$env:GITHUB_WORKSPACE/BUILD_NOTE.txt" "auk-motion is a lib crate; import lib packaged if present."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  smoke-demo:
    name: smoke · humanize demo bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      # 无头冒烟：示例 AHK 脚本 → IR → 拟人化轨迹（精确模式确定性 + 拟人模式非直线的最小闭环）
      - name: Core smoke test
        run: pnpm --filter @auk-flow/core test

      - name: Upload range tool
        uses: actions/upload-artifact@v4
        with:
          name: range-tool
          path: tools/range/index.html

  tauri-app:
    name: desktop · Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: aukflow-desktop-linux
            binary: auk-desktop
          - os: windows-latest
            artifact: aukflow-desktop-windows
            binary: auk-desktop.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install webkit2gtk system deps (linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile=false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Frontend build
        run: pnpm --filter @auk-flow/desktop build

      - name: Tauri build
        shell: bash
        run: |
          cd packages/desktop
          pnpm exec tauri build

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-tauri
          cp "packages/desktop/src-tauri/target/release/${{ matrix.binary }}" dist-tauri/ || true
          cp -r packages/desktop/src-tauri/target/release/bundle dist-tauri/ || true
          # 插件随包分发（运行时按 exe 同级 plugins/ 查找）
          cp -r plugins dist-tauri/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-tauri/

  release:
    name: release (on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-binaries, tauri-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.msi
            dist/**/*.exe
            dist/aukflow-desktop-*/
            dist/range-tool/index.html
